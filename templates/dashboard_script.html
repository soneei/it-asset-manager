<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT 资产管理系统资产仪表盘</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header h1 { color: #1a1a2e; font-size: 24px; font-weight: 600; }
        .header p { color: #666; font-size: 14px; margin-top: 4px; }
        
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .kpi-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .kpi-card .label { font-size: 13px; color: #888; margin-bottom: 8px; }
        .kpi-card .value { font-size: 28px; font-weight: 700; color: #1a1a2e; }
        .kpi-card .sub { font-size: 12px; color: #999; margin-top: 4px; }
        .kpi-card.blue .value { color: #3b82f6; }
        .kpi-card.green .value { color: #10b981; }
        .kpi-card.orange .value { color: #f59e0b; }
        .kpi-card.red .value { color: #ef4444; }
        
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .chart-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .chart-card h3 { font-size: 15px; color: #333; margin-bottom: 16px; font-weight: 600; }
        .chart-container { position: relative; height: 260px; }
        
        .table-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .table-card h3 { font-size: 15px; color: #333; margin-bottom: 16px; font-weight: 600; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { 
            text-align: left; 
            padding: 12px 8px; 
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
        }
        th { color: #666; font-weight: 500; background: #fafafa; }
        td { color: #333; }
        tr:hover { background: #f8f9fa; }
        
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .status-in_use { background: #10b981; }
        .status-in_stock { background: #3b82f6; }
        .status-idle { background: #f59e0b; }
        .status-disposed { background: #ef4444; }
        .status-under_repair { background: #8b5cf6; }
        
        .refresh-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59,130,246,0.4);
        }
        .refresh-btn:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="header">
        <h1>IT 资产管理系统 IT 资产仪表盘</h1>
        <p>数据来源：资产管理系统 | 实时统计</p>
    </div>
    
    <div class="kpi-grid">
        <div class="kpi-card blue">
            <div class="label">资产总数</div>
            <div class="value" id="total-count">--</div>
            <div class="sub">累计入库</div>
        </div>
        <div class="kpi-card green">
            <div class="label">在用资产</div>
            <div class="value" id="in-use-count">--</div>
            <div class="sub">使用中</div>
        </div>
        <div class="kpi-card orange">
            <div class="label">资产总价值</div>
            <div class="value" id="total-value">--</div>
            <div class="sub">采购原值</div>
        </div>
        <div class="kpi-card red">
            <div class="label">待处置</div>
            <div class="value" id="idle-count">--</div>
            <div class="sub">闲置/报废</div>
        </div>
    </div>
    
    <div class="charts-grid">
        <div class="chart-card">
            <h3>资产类型分布</h3>
            <div class="chart-container">
                <canvas id="typeChart"></canvas>
            </div>
        </div>
        <div class="chart-card">
            <h3>品牌分布 TOP 8</h3>
            <div class="chart-container">
                <canvas id="brandChart"></canvas>
            </div>
        </div>
        <div class="chart-card">
            <h3>状态分布</h3>
            <div class="chart-container">
                <canvas id="statusChart"></canvas>
            </div>
        </div>
        <div class="chart-card">
            <h3>价格区间分布</h3>
            <div class="chart-container">
                <canvas id="priceChart"></canvas>
            </div>
        </div>
    </div>
    
    <div class="table-card">
        <h3>资产明细（随机10条）</h3>
        <table id="asset-table">
            <thead>
                <tr>
                    <th>编码</th>
                    <th>名称</th>
                    <th>类型</th>
                    <th>品牌/型号</th>
                    <th>状态</th>
                    <th>使用人</th>
                    <th>采购价</th>
                </tr>
            </thead>
            <tbody id="asset-tbody"></tbody>
        </table>
    </div>
    
    <button class="refresh-btn" onclick="loadData()">刷新数据</button>
    
    <script>
        const STATUS_LABELS = {
            'in_use': '在用',
            'in_stock': '库存',
            'idle': '闲置',
            'disposed': '已处置',
            'under_repair': '维保中',
            'transferred': '调拨中'
        };
        
        const TYPE_LABELS = {
            'laptop': '笔记本电脑',
            'desktop': '台式机',
            'monitor': '显示器',
            'phone': '手机',
            'tablet': '平板',
            'keyboard_mouse': '键鼠套装',
            'printer': '打印机',
            'other': '其他'
        };
        
        const COLORS = [
            '#3b82f6', '#10b981', '#f59e0b', '#ef4444', 
            '#8b5cf6', '#ec4899', '#06b6d4', '#84cc16'
        ];
        
        let charts = {};
        
        async function loadData() {
            try {
                const response = await fetch('data/assets.json');
                const data = await response.json();
                renderDashboard(data);
            } catch (e) {
                console.error('加载失败:', e);
                // 尝试本地路径
                const response = await fetch('assets.json');
                const data = await response.json();
                renderDashboard(data);
            }
        }
        
        function renderDashboard(data) {
            const assets = data.assets || [];
            
            // KPI 统计
            const total = assets.length;
            const inUse = assets.filter(a => a.status === 'in_use').length;
            const idle = assets.filter(a => ['idle', 'disposed'].includes(a.status)).length;
            const totalValue = assets.reduce((sum, a) => sum + (a.purchase_price || 0), 0);
            
            document.getElementById('total-count').textContent = total;
            document.getElementById('in-use-count').textContent = inUse;
            document.getElementById('idle-count').textContent = idle;
            document.getElementById('total-value').textContent = '¥' + (totalValue / 10000).toFixed(0) + '万';
            
            // 类型分布
            const typeCount = {};
            assets.forEach(a => {
                const t = a.asset_type || 'other';
                typeCount[t] = (typeCount[t] || 0) + 1;
            });
            renderPieChart('typeChart', 
                Object.values(typeCount).map(c => c),
                Object.keys(typeCount).map(t => TYPE_LABELS[t] || t)
            );
            
            // 品牌分布 TOP 8
            const brandCount = {};
            assets.forEach(a => {
                if (a.brand) brandCount[a.brand] = (brandCount[a.brand] || 0) + 1;
            });
            const topBrands = Object.entries(brandCount).sort((a, b) => b[1] - a[1]).slice(0, 8);
            renderBarChart('brandChart',
                topBrands.map(b => b[1]),
                topBrands.map(b => b[0])
            );
            
            // 状态分布
            const statusCount = {};
            assets.forEach(a => {
                statusCount[a.status] = (statusCount[a.status] || 0) + 1;
            });
            renderPieChart('statusChart',
                Object.values(statusCount),
                Object.keys(statusCount).map(s => STATUS_LABELS[s] || s)
            );
            
            // 价格区间
            const priceRanges = { '<1000': 0, '1000-3000': 0, '3000-5000': 0, '5000-8000': 0, '>8000': 0, '未填': 0 };
            assets.forEach(a => {
                const p = a.purchase_price || 0;
                if (p === 0) priceRanges['未填']++;
                else if (p < 1000) priceRanges['<1000']++;
                else if (p < 3000) priceRanges['1000-3000']++;
                else if (p < 5000) priceRanges['3000-5000']++;
                else if (p < 8000) priceRanges['5000-8000']++;
                else priceRanges['>8000']++;
            });
            renderBarChart('priceChart',
                Object.values(priceRanges),
                Object.keys(priceRanges)
            );
            
            // 资产明细表
            const shuffled = [...assets].sort(() => Math.random() - 0.5).slice(0, 10);
            const tbody = document.getElementById('asset-tbody');
            tbody.innerHTML = shuffled.map(a => `
                <tr>
                    <td><code style="font-size:12px">${a.asset_id}</code></td>
                    <td>${a.name || '-'}</td>
                    <td>${TYPE_LABELS[a.asset_type] || a.asset_type || '-'}</td>
                    <td>${a.brand || ''} ${a.model || ''}</td>
                    <td>
                        <span class="status-dot status-${a.status}"></span>
                        ${STATUS_LABELS[a.status] || a.status}
                    </td>
                    <td>${a.assignee || '-'}</td>
                    <td>${a.purchase_price ? '¥' + a.purchase_price.toLocaleString() : '-'}</td>
                </tr>
            `).join('');
        }
        
        function renderPieChart(canvasId, data, labels) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            if (charts[canvasId]) charts[canvasId].destroy();
            charts[canvasId] = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: COLORS.slice(0, data.length),
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right', labels: { font: { size: 12 } } }
                    }
                }
            });
        }
        
        function renderBarChart(canvasId, data, labels) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            if (charts[canvasId]) charts[canvasId].destroy();
            charts[canvasId] = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: COLORS[0],
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    indexAxis: 'y',
                    plugins: { legend: { display: false } },
                    scales: { x: { grid: { display: false } } }
                }
            });
        }
        
        loadData();
    </script>
</body>
</html>
